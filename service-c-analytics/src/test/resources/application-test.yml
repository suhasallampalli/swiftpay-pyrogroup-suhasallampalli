spring:
  datasource:
    url: >-
      jdbc:h2:mem:swiftpay_analytics_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS analytics
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: analytics
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: analytics-service-test
      auto-offset-reset: earliest
      enable-auto-commit: false

swiftpay:
  kafka:
    topics:
      payment-completed: payment.completed.test
